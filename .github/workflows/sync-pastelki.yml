# Pulls newer approved pictures from Pastelki (https://pastelki.club) and rebuilds the colouring pages.
# Runs hourly, on demand, and when Pastelki (or `studio sync-art --dispatch`) sends a `pastelki-updated` event.
# Commits to master only when something changed and every check passes; children get it with the next build.
name: Sync pictures from Pastelki

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [pastelki-updated]

permissions:
  contents: write

concurrency:
  group: sync-pastelki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync
        id: sync
        run: |
          npm run --silent sync-art | tee sync.log
          if git diff --quiet -- tools/pages/svgs src/coloring/pages; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check
        if: steps.sync.outputs.changed == 'true'
        run: npm run check
      - name: Commit
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "pastelki-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/pages/svgs src/coloring/pages
          git commit -m "Sync pictures from Pastelki" -m "$(head -1 sync.log)"
          git push
